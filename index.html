    <!--
      Bitter is the display face for the Showcase page: a heavy slab serif, the
      kind of type a personal site of that era set its name in. It carries the
      whole visual identity of the document, so it is loaded rather than left
      to a system fallback — there is no slab serif on a default machine, and
      falling back to Georgia bold loses the effect entirely. Body copy DOES
      fall back to Georgia/Times on purpose; that is period-correct.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Fira+Code:wght@400;500;600;700&family=Bitter:wght@700;800&display=swap"
      rel="stylesheet"
    />
